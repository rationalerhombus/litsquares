<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Book Grid | Daily Challenge</title>
    <style>
        /* CORE LAYOUT */
        * { box-sizing: border-box; }
        body { 
            background-color: #fdf5e6; 
            font-family: 'Georgia', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 10px; 
            color: #003366; 
            margin: 0; 
            overflow-x: hidden; 
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; text-align: center; }
        #status-bar { margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        
        /* THE GRID: 4 columns, 4 rows (1 header row + 3 author rows) */
        .game-container { 
            display: grid; 
            grid-template-columns: 80px 1fr 1fr 1fr; 
            grid-template-rows: 65px 100px 100px 100px; 
            border: 3px solid #003366; 
            background-color: #003366; 
            gap: 2px; 
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .cell { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: white; 
            padding: 4px; 
            text-align: center; 
            font-weight: bold; 
            position: relative; 
            word-wrap: break-word;
        }

        .header { 
            background-color: #fdf5e6; 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            line-height: 1.2;
            padding: 2px;
        }

        input { 
            width: 100%; 
            height: 100%; 
            border: none; 
            outline: none; 
            text-align: center; 
            font-family: inherit; 
            font-size: 0.8rem; 
            background: transparent;
        }
        
        .correct { background-color: #d4edda !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; }
        
        /* SEARCH DROPDOWN */
        .suggestions { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: white; 
            border: 1px solid #003366; 
            z-index: 100; 
            display: none; 
            max-height: 110px; 
            overflow-y: auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .suggestion-item { padding: 12px 8px; cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #eee; color: black; text-align: left; line-height: 1.3; }

        /* DESKTOP UPSCALING */
        @media (min-width: 480px) {
            .game-container { grid-template-columns: 110px 140px 140px 140px; grid-template-rows: 80px 140px 140px 140px; }
            .header { font-size: 0.8rem; }
            input { font-size: 0.95rem; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <h1>The Book Grid</h1>
    <div id="status-bar">Guesses: <span id="guess-count">9</span> Left</div>
    <div class="game-container" id="grid"></div>

    <script src="authors.js"></script>

    <script>
        const columnsPool = [
            { label: "Movie/TV Adaptation", id: "movie" },
            { label: "Published Pre-1950", id: "pre1950" },
            { label: "Major Award Winner", id: "award" },
            { label: "Classic Era (Pre-1970)", id: "classic" },
            { label: "Modern Era (Post-1970)", id: "modern" }
        ];

        let guessesLeft = 9;
        const guessDisplay = document.getElementById('guess-count');

        // 2. DAILY SEED (Changes at 9 PM PT)
        function getDailySeed() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const ptDate = new Date(utc + (3600000 * -8));
            const adjustedDate = new Date(ptDate.getTime() + (3 * 3600000));
            return adjustedDate.getFullYear() * 10000 + (adjustedDate.getMonth() + 1) * 100 + adjustedDate.getDate();
        }

        function seededRandom(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // 3. GENERATION LOGIC
        async function initGame() {
            if (typeof authorsPool === 'undefined') {
                document.getElementById('grid').innerHTML = "<div style='color:red; padding:20px;'>Error: authors.js not loaded correctly.</div>";
                return;
            }

            const seedValue = getDailySeed();
            const randomFunc = seededRandom(seedValue);
            
            let selectedCols, selectedRows;
            let attempts = 0;

            // Strategy: Categories first, then find authors who fit all 3
            while (attempts < 1000) {
                let trialCols = [...columnsPool].sort(() => randomFunc() - 0.5).slice(0, 3);
                let qualifiedAuthors = authorsPool.filter(auth => 
                    trialCols.every(col => auth.can.includes(col.id))
                );

                if (qualifiedAuthors.length >= 3) {
                    selectedCols = trialCols;
                    selectedRows = qualifiedAuthors.sort(() => randomFunc() - 0.5).slice(0, 3);
                    break;
                }
                attempts++;
            }

            // Safety Fallback
            if (!selectedRows) {
                selectedCols = columnsPool.slice(0, 3);
                selectedRows = authorsPool.slice(0, 3);
            }

            renderGrid(selectedRows, selectedCols);
        }

        function renderGrid(rows, cols) {
            const gridElement = document.getElementById('grid');
            let html = `<div class="cell header"></div>`;
            cols.forEach(c => html += `<div class="cell header">${c.label}</div>`);
            rows.forEach(r => {
                html += `<div class="cell header">${r.name}</div>`;
                cols.forEach(c => {
                    html += `<div class="cell" data-row="${r.name}" data-col="${c.id}">
                                <input type="text" class="book-input" autocomplete="off" placeholder="...">
                                <div class="suggestions"></div>
                             </div>`;
                });
            });
            gridElement.innerHTML = html;
            attachInputLogic();
        }

        // 4. SEARCH AND VALIDATION
        function attachInputLogic() {
            const inputs = document.querySelectorAll('.book-input');
            inputs.forEach(input => {
                input.addEventListener('input', async (e) => {
                    const query = e.target.value;
                    const suggestionBox = e.target.nextElementSibling;
                    if (query.length < 3) { suggestionBox.style.display = 'none'; return; }
                    
                    try {
                        const response = await fetch(`https://openlibrary.org/search.json?title=${query}&limit=6`);
                        const data = await response.json();
                        suggestionBox.innerHTML = '';
                        data.docs.forEach(book => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = book.subtitle ? `${book.title}: ${book.subtitle}` : book.title;
                            div.onclick = () => {
                                suggestionBox.style.display = 'none';
                                validateGuess(input, book);
                            };
                            suggestionBox.appendChild(div);
                        });
                        suggestionBox.style.display = 'block';
                    } catch (e) { console.log("API Error"); }
                });
            });
        }

        function validateGuess(input, bookData) {
            if (guessesLeft <= 0) return;
            const cell = input.parentElement;
            const targetAuthor = cell.getAttribute('data-row');
            const targetCategory = cell.getAttribute('data-col');
            
            const bookAuthors = bookData.author_name ? bookData.author_name.join(',') : "";
            const publishYear = parseInt(bookData.first_publish_year) || 9999;
            const hasMovie = bookData.id_imdb ? true : false;

            let isCorrect = false;
            const authorMatch = bookAuthors.toLowerCase().includes(targetAuthor.toLowerCase());

            if (authorMatch) {
                if (targetCategory === 'movie' && hasMovie) isCorrect = true;
                if (targetCategory === 'pre1950' && publishYear < 1950) isCorrect = true;
                if (targetCategory === 'award') isCorrect = true;
                if (targetCategory === 'classic' && publishYear < 1970) isCorrect = true;
                if (targetCategory === 'modern' && publishYear >= 1970) isCorrect = true;
            }

            guessesLeft--;
            guessDisplay.innerText = guessesLeft;

            if (isCorrect) {
                input.value = bookData.title;
                cell.classList.add('correct');
                input.disabled = true;
            } else {
                cell.classList.add('wrong');
                input.value = "WRONG";
                setTimeout(() => {
                    cell.classList.remove('wrong');
                    input.value = "";
                }, 800);
            }

            if (guessesLeft === 0) {
                setTimeout(() => { alert("Game Over! New puzzle at 9 PM PT."); }, 500);
            }
        }

        initGame();
    </script>
</body>
</html>
